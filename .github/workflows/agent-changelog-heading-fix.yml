name: Agent changelog heading fix

on:
  push:
    branches:
      - tool-builder-implemented-audit-ledger

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tool-builder-implemented-audit-ledger
      - name: Fix changelog heading
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text()
          title='This product-hardening build organizes the remaining modeled Tool Builder inventory into coherent functional slices and tightens the handoff so future agents keep working the real Product Build Next queue while updating release history'
          bad='## v10.20\n\n- Added the Build 2 implemented-builder audit ledger so currently registered implemented builders are grouped into pass/fail repair families, with database builders passing and older implemented builders failing visibly until their direct-route guidance is repaired.\n- Clarified that direct Tools routes must not proof-gate command generation; Evidence gates proof claims and Next Steps movement after execution, not action selection or command preview generation.\n — '+title+'\n'
          good='## v10.20 — '+title+'\n\n- Added the Build 2 implemented-builder audit ledger so currently registered implemented builders are grouped into pass/fail repair families, with database builders passing and older implemented builders failing visibly until their direct-route guidance is repaired.\n- Clarified that direct Tools routes must not proof-gate command generation; Evidence gates proof claims and Next Steps movement after execution, not action selection or command preview generation.\n'
          if bad in s:
              s=s.replace(bad,good,1)
          elif '## v10.20 — '+title not in s:
              raise SystemExit('expected malformed or fixed heading not found')
          p.write_text(s)
          PY
      - name: Commit heading fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-changelog-heading-fix.yml
          git add CHANGELOG.md
          git commit -m "Fix changelog v10.20 heading"
          git push origin tool-builder-implemented-audit-ledger
