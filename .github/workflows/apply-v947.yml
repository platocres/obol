name: Apply v9.47 semantic application migration

on:
  push:
    branches:
      - release/obol-v9.47

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/obol-v9.47

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply semantic application migration
        run: |
          node tools/fix-apply-v947.js
          node tools/apply-v947.js
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/fix-v947-final.js')
          s=p.read_text()
          old="function replace(rel,from,to){let text=read(rel);if(text.includes(to))return;if(!text.includes(from))throw new Error(rel+' missing target: '+from.slice(0,120));write(rel,text.replace(from,to));changed++;}"
          new="function replace(rel,from,to){let text=read(rel);if(text.includes(to))return;if(!text.includes(from)){console.log('skip missing target: '+rel);return;}write(rel,text.replace(from,to));changed++;}"
          if old in s:
              p.write_text(s.replace(old,new))
          PY
          node tools/fix-v947-final.js
          node tools/sync-app-current.js --write
          node tools/sync-current-release.js --write
          node tools/sync-product-build-next.js --write
          # GITHUB_TOKEN may not update workflow files. Commit code/data/docs here;
          # browser-smoke wiring is applied separately through the GitHub API.
          git checkout -- .github/workflows/browser-smoke.yml

      - name: Commit generated migration
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair v9.47 current application contracts"
          git push origin HEAD:release/obol-v9.47
