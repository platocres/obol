name: Agent prepend changelog

on:
  push:
    branches:
      - agent/tool-builder-inventory-handoff-cleanup

permissions:
  contents: write

jobs:
  prepend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tool-builder-inventory-handoff-cleanup
      - name: Prepend changelog entry and remove temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changelog = Path('CHANGELOG.md')
          workflow = Path('.github/workflows/agent-prepend-changelog.yml')
          entry = '''## Unreleased - Tool Builder inventory organization and handoff cleanup

- Reorganized the live Tools route's remaining Tool Builder inventory from one flat chip wall into functional implementation slices while keeping every real tool selectable.
- Exposed grouped modeled inventory through `OBOL_TOOL_BUILDER_IMPLEMENTATION_AUDIT_CURRENT.activeBatches()` and `auditSnapshot()` so future agents can burn down coherent tool families instead of random one-offs.
- Added a focused Tool Builder inventory organization regression covering taxonomy, grouped active batches, and classic-tool classification.
- Slimmed the README back to an entrypoint with canonical linked docs, one Product Build Next block, and a hard changelog rule for product-affecting builds.
- Added PR-template release-history fields so product-visible work cannot quietly skip `CHANGELOG.md` again.
'''
          data = changelog.read_text()
          if '## Unreleased - Tool Builder inventory organization and handoff cleanup' not in data:
              changelog.write_text(entry + '\n' + data)
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit generated changelog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/agent-prepend-changelog.yml
          git commit -m "Update changelog for Tool Builder inventory build" || exit 0
          git push
