name: Apply Obol v9.46 release changes

on:
  push:
    branches:
      - release/obol-v9.46
    paths:
      - .github/workflows/apply-v946.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/obol-v9.46
          fetch-depth: 0

      - name: Apply v9.46 changes
        run: node tools/apply-v946-release.js

      - name: Commit generated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement v9.46 single-paint current boot"
          git push origin HEAD:release/obol-v9.46
