name: Obol v9.19 docs cleanup

on:
  push:
    branches:
      - release/obol-v9.19
    paths:
      - '.github/workflows/v919-clean-docs.yml'

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/obol-v9.19
      - name: Normalize Markdown code spans
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['docs/v9.19.md','docs/TOOL-BUILDER-COVERAGE.md']:
              p=Path(name)
              p.write_text(p.read_text().replace('\\`','`'))
          PY
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v9.19.md docs/TOOL-BUILDER-COVERAGE.md
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize v9.19 documentation formatting'
          git push origin HEAD:release/obol-v9.19
