name: Sync generated release artifacts

on:
  push:
    branches:
      - 'release/obol-*'
    paths:
      - '.github/workflows/sync-release-artifacts.yml'
      - 'data/**'
      - 'assets/**'
      - 'docs/v*.md'
      - 'tools/sync-*.js'
      - 'tools/style-cascade-current.js'
      - 'tools/current-runtime.js'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Synchronize generated release artifacts
        run: |
          node tools/sync-generated.js --write
          node tools/sync-generated.js --check

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html CHANGELOG.md \
            assets/obol-domain-current.js assets/obol-core-current.js \
            assets/obol-app-current.js assets/obol-evidence-current.js \
            assets/obol-nmap-current.js assets/obol-report-overlays-current.js \
            assets/obol-tool-reference-current.js assets/obol-current.css
          if git diff --cached --quiet; then
            echo "Generated release artifacts already current."
            exit 0
          fi
          git commit -m "Sync generated release artifacts"
          git push origin HEAD:${{ github.ref_name }}
