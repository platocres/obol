name: Obol browser smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '42 8 * * *'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: obol-browser-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHOULD_DEEP_BROWSER: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') && contains(github.event.head_commit.message, '[full-regression]')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Serve Obol
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/obol-http.log 2>&1 &
          echo $! > /tmp/obol-http.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/obol-http.log
          exit 1

      - name: Run browser smoke
        env:
          OBOL_SMOKE_BASE_URL: http://127.0.0.1:4173/index.html
          OBOL_SMOKE_OUTPUT: artifacts/playwright-smoke
        run: node tests/playwright-smoke.js

      - name: Prove the v9.43 application retirement in a browser
        env:
          OBOL_SMOKE_BASE_URL: http://127.0.0.1:4173/index.html
        run: |
          set -euo pipefail
          if [[ "${SHOULD_DEEP_BROWSER}" != "true" ]]; then
            echo "Deep browser proof runs on main, workflow_dispatch, schedule, or release [full-regression]; PRs and ordinary release pushes keep route smoke fast."
            exit 0
          fi
          node tools/validate-app-dom-equivalence.js

      - name: Prove the v9.45 semantic stylesheet in a browser
        env:
          OBOL_SMOKE_BASE_URL: http://127.0.0.1:4173/index.html
        run: |
          set -euo pipefail
          if [[ "${SHOULD_DEEP_BROWSER}" != "true" ]]; then
            echo "Deep browser proof runs on main, workflow_dispatch, schedule, or release [full-regression]; PRs and ordinary release pushes keep route smoke fast."
            exit 0
          fi
          node tools/validate-style-visual-equivalence.js

      - name: Prove the v9.46 single-paint current boot in a browser
        env:
          OBOL_SMOKE_BASE_URL: http://127.0.0.1:4173/index.html
        run: |
          set -euo pipefail
          if [[ "${SHOULD_DEEP_BROWSER}" != "true" ]]; then
            echo "Deep browser proof runs on main, workflow_dispatch, schedule, or release [full-regression]; PRs and ordinary release pushes keep route smoke fast."
            exit 0
          fi
          node tools/validate-single-paint-boot-browser.js

      - name: Prove v9.47 semantic application ownership across the historical timer horizon
        env:
          OBOL_SMOKE_BASE_URL: http://127.0.0.1:4173/index.html
        run: |
          set -euo pipefail
          if [[ "${SHOULD_DEEP_BROWSER}" != "true" ]]; then
            echo "Deep browser proof runs on main, workflow_dispatch, schedule, or release [full-regression]; PRs and ordinary release pushes keep route smoke fast."
            exit 0
          fi
          node tools/validate-app-semantic-boot-browser.js

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obol-browser-smoke-${{ github.run_id }}
          path: artifacts/playwright-smoke
          if-no-files-found: warn
          retention-days: 14
