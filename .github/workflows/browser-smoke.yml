name: Obol browser smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '42 8 * * *'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: obol-browser-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHOULD_FULL_BROWSER: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') && contains(github.event.head_commit.message, '[full-regression]')) }}
      SHOULD_DEEP_EQUIVALENCE: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') && contains(github.event.head_commit.message, '[full-regression]')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright package
        run: npm install --no-save --no-package-lock playwright@1.62.1

      - name: Resolve system browser for fast smoke
        if: env.SHOULD_FULL_BROWSER != 'true'
        run: |
          set -euo pipefail
          for browser in /usr/bin/google-chrome-stable /usr/bin/google-chrome /usr/bin/chromium-browser /usr/bin/chromium; do
            if [[ -x "${browser}" ]]; then
              echo "OBOL_SMOKE_BROWSER_PATH=${browser}" >> "${GITHUB_ENV}"
              echo "Using system browser for fast smoke: ${browser}"
              exit 0
            fi
          done
          echo "No system Chrome or Chromium binary found for fast browser smoke." >&2
          exit 1

      - name: Install Playwright Chromium for full browser proof
        if: env.SHOULD_FULL_BROWSER == 'true'
        run: npx playwright install --with-deps chromium

      - name: Serve Obol
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/obol-http.log 2>&1 &
          echo $! > /tmp/obol-http.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/obol-http.log
          exit 1

      - name: Run fast browser route smoke
        if: env.SHOULD_FULL_BROWSER != 'true'
        env:
          OBOL_SMOKE_BASE_URL: http://127.0.0.1:4173/index.html
          OBOL_SMOKE_OUTPUT: artifacts/playwright-smoke
        run: node tests/playwright-route-smoke.js

      - name: Run note-derived card route smoke
        if: env.SHOULD_FULL_BROWSER == 'true'
        env:
          OBOL_SMOKE_BASE_URL: http://127.0.0.1:4173/index.html
          OBOL_SMOKE_OUTPUT: artifacts/playwright-smoke
        run: node tests/playwright-note-card-routes.js

      - name: Run full browser smoke
        if: env.SHOULD_FULL_BROWSER == 'true'
        env:
          OBOL_SMOKE_BASE_URL: http://127.0.0.1:4173/index.html
          OBOL_SMOKE_OUTPUT: artifacts/playwright-smoke
        run: node tests/playwright-smoke.js

      - name: Prove the v9.43 application retirement in a browser
        if: env.SHOULD_DEEP_EQUIVALENCE == 'true'
        env:
          OBOL_SMOKE_BASE_URL: http://127.0.0.1:4173/index.html
        run: node tools/validate-app-dom-equivalence.js

      - name: Prove the v9.45 semantic stylesheet in a browser
        if: env.SHOULD_DEEP_EQUIVALENCE == 'true'
        env:
          OBOL_SMOKE_BASE_URL: http://127.0.0.1:4173/index.html
        run: node tools/validate-style-visual-equivalence.js

      - name: Prove the v9.46 single-paint current boot in a browser
        if: env.SHOULD_DEEP_EQUIVALENCE == 'true'
        env:
          OBOL_SMOKE_BASE_URL: http://127.0.0.1:4173/index.html
        run: node tools/validate-single-paint-boot-browser.js

      - name: Prove v9.47 semantic application ownership across the historical timer horizon
        if: env.SHOULD_DEEP_EQUIVALENCE == 'true'
        env:
          OBOL_SMOKE_BASE_URL: http://127.0.0.1:4173/index.html
        run: node tools/validate-app-semantic-boot-browser.js

      - name: Upload browser screenshots
        if: failure() || env.SHOULD_FULL_BROWSER == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: obol-browser-smoke-${{ github.run_id }}
          path: artifacts/playwright-smoke
          if-no-files-found: warn
          retention-days: 14
