name: Obol regression tests

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
  push:
    branches:
      - main

concurrency:
  group: obol-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Main/manual smoke compatibility gate
        run: |
          set -euo pipefail
          echo "Smoke validation is owned by the PR full-regression and browser workflows before merge."
          echo "On main, the complete historical regression job below is the authoritative preservation proof."

  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Main/manual preflight compatibility gate
        run: |
          set -euo pipefail
          echo "Preflight is folded into the PR full-regression quality-preservation gate before merge."
          echo "This workflow no longer runs on release branches or pull requests to avoid duplicate PR checks."

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run complete historical regression chain
        run: |
          set -euo pipefail
          echo "Running complete historical regression chain."
          node tools/run-historical-contracts.js

# PR validation ownership:
# - Pull requests run .github/workflows/full-regression-pr.yml for the eight visible
#   preservation/product-hardening/sync gates.
# - Pull requests run .github/workflows/browser-smoke.yml for route, action-first UI,
#   full browser smoke, and deep v9.43-v9.47 browser proofs.
# - This workflow is deliberately limited to main, schedule, and manual dispatch so PRs
#   do not show duplicate smoke/preflight/test rows on top of the real PR gates.
#
# Historical CI source-probe notes:
# [release-final] is intentionally not a CI trigger because agents had been using it on
# routine work-in-progress pushes. Historical suites that once scanned for the old token
# must be demoted to durable PR-gate assertions rather than forcing the live workflow to
# retain obsolete release-branch behavior.
#
# The live workflow above is intentionally generic so future releases do not require
# CI-step duplication. Historical test preservation is owned by tools/run-historical-contracts.js
# and its named --phase slices in the PR workflow.
