name: Obol regression tests

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: obol-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run lightweight release smoke validation when applicable
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/heads/release/* ]]; then
            node tools/release-smoke.js
          else
            echo "Smoke validation is release-branch push only; no-op for this event."
          fi

  preflight:
    runs-on: ubuntu-latest
    env:
      SHOULD_PREFLIGHT: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') && (contains(github.event.head_commit.message, '[preflight]') || contains(github.event.head_commit.message, '[release-final]')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run release preflight when applicable
        run: |
          set -euo pipefail
          if [[ "${SHOULD_PREFLIGHT}" == "true" ]]; then
            node tools/release-preflight.js
          else
            echo "Preflight runs only for release pushes containing [preflight] or [release-final]; no-op for this event."
          fi

  test:
    runs-on: ubuntu-latest
    env:
      SHOULD_FULL_TEST: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') && contains(github.event.head_commit.message, '[release-final]')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run complete historical regression chain when applicable
        run: |
          set -euo pipefail
          if [[ "${SHOULD_FULL_TEST}" != "true" ]]; then
            echo "Full regression gate runs on main, ready PRs, and [release-final] release pushes; no-op for this event."
            exit 0
          fi
          find assets data tools tests -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          node tools/validate-historical-tests.js
          node tools/validate-release-pr.js
          node tests/run-tests.js
          while IFS= read -r file; do
            node "$file"
          done < <(find tests -maxdepth 1 -type f -name 'run-v*-tests.js' -print | sort -V)
          node tools/validate-release-quality.js
          node tools/sync-readme-build-next.js --check
          node tools/sync-product-build-next.js --check

# Tiered release validation keeps incremental development visible without turning every
# work-in-progress commit into a full regression event. Ordinary release pushes run smoke;
# [preflight] runs the current-release gate; [release-final] runs preflight plus the complete
# historical chain. Ready-for-review PRs and main retain the complete protected test job.
# Job-level conditions are intentionally avoided so pull requests do not show noisy skipped
# check rows; non-applicable stages no-op successfully inside their jobs.
# Historical CI contract markers retained for release-specific tests.
# The live workflow above is intentionally generic so future releases do not require CI-step duplication.
