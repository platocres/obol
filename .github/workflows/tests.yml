name: Obol regression tests

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: obol-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run lightweight release smoke validation when applicable
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            node tools/release-smoke.js
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/heads/release/* ]]; then
            node tools/release-smoke.js
          else
            echo "Smoke validation runs for pull requests and release-branch pushes; no-op for this event."
          fi

  preflight:
    runs-on: ubuntu-latest
    env:
      # Historical CI contract marker: contains(github.event.head_commit.message, '[release-final]')
      # Historical CI contract marker: '[release-final]'
      SHOULD_PREFLIGHT: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') && (contains(github.event.head_commit.message, '[preflight]') || contains(github.event.head_commit.message, '[full-regression]')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run release preflight when applicable
        run: |
          set -euo pipefail
          if [[ "${SHOULD_PREFLIGHT}" == "true" ]]; then
            node tools/release-preflight.js
          else
            echo "Preflight runs only for release pushes containing [preflight] or [full-regression]; no-op for this event."
          fi

  test:
    runs-on: ubuntu-latest
    env:
      SHOULD_FULL_TEST: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') && contains(github.event.head_commit.message, '[full-regression]')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run complete historical regression chain or targeted PR gate
        run: |
          set -euo pipefail
          if [[ "${SHOULD_FULL_TEST}" == "true" ]]; then
            echo "Running complete historical regression chain."
            node tools/run-historical-contracts.js
            exit 0
          fi
          echo "Running targeted current-release gate instead of the complete historical chain."
          node tools/release-smoke.js
          ref_name="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          if [[ "${ref_name}" =~ release/obol-v([0-9]+[.][0-9]+([.][0-9]+)?) ]]; then
            suite="tests/run-v${BASH_REMATCH[1]}-tests.js"
            if [[ -f "${suite}" ]]; then
              node "${suite}"
            else
              echo "No release-specific suite found at ${suite}; release smoke already ran."
            fi
          else
            echo "No release branch version detected; release smoke already ran."
          fi

# Tiered release validation keeps the legacy check names stable while the separate
# Obol full historical PR gate requires tools/run-historical-contracts.js before merge.
# Pull requests also have an explicit full-historical PR workflow gated with:
# github.event.pull_request.draft == false
# [release-final] is intentionally not a CI trigger because agents had been using
# it on routine work-in-progress pushes. Use [full-regression] only for the exact
# head that needs full preservation proof.
# Historical tests remain the preservation gate for old release behavior, Evidence
# conservatism, Next Steps contracts, dashboard ownership, runtime flattening, and
# no-sediment/no-wrapper guarantees.
# Job-level conditions are intentionally avoided in this workflow so pull requests do not show noisy skipped
# check rows; non-applicable stages no-op successfully inside their jobs.
# Historical CI contract markers retained for release-specific tests.
# The live workflow above is intentionally generic so future releases do not require CI-step duplication.
