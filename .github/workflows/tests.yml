name: Obol regression tests

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: obol-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run release preflight
        run: node tools/release-preflight.js

  test:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate all JavaScript syntax
        run: find assets data tools tests -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Run complete historical regression chain
        run: |
          set -euo pipefail
          node tests/run-tests.js
          while IFS= read -r file; do
            node "$file"
          done < <(find tests -maxdepth 1 -type f -name 'run-v*-tests.js' -print | sort -V)
      - name: Check README Build Next synchronization
        run: node tools/sync-readme-build-next.js --check

