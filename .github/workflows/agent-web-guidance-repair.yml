});}
const profiles=freeze({
 'tb-ffuf':profile('tb-ffuf','ffuf','Fast FUZZ-position discovery for paths, virtual hosts, parameters, and authenticated request variants.','Choose ffuf when the important question is where the FUZZ marker belongs and you want tight filters, calibration, headers, and request-rate control.',['gobuster','feroxbuster','wfuzz','curl'],guide('Use ffuf when you know the exact substitution point and need a focused fuzz run. Pick content, virtual-host, or recursion context first, then tune filters from observed baseline noise.','action',['Place FUZZ deliberately before widening the run.','Start with a small wordlist and one filter strategy.','Paste distinct rows and noisy baseline notes back into Evidence.'],[
