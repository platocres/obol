 'tb-burp-suite':profile('tb-burp-suite','Burp Suite','GUI workflow guidance for proxying, scoping, Repeater verification, Intruder payload placement, Scanner triage, and raw request import.','Choose Burp when visual request inspection, manual replay, payload placement, or scanner triage is more important than a one-shot CLI command.',['curl','ffuf','sqlmap','ZAP'],guide('Use Burp as a guided GUI handoff. Obol describes what to set up and what output to paste back; the human still drives Burp.','workflow',['Pick the workflow you are actually doing.','Keep scope and payload positions explicit.','Paste request/response observations, not vague GUI success.'],[
