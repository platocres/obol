name: Agent web guidance repair

on:
  push:
    branches:
      - tool-builder-web-guidance-repair

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tool-builder-web-guidance-repair
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch web guidance repair
        run: |
          python3 <<'PY'
          from pathlib import Path
          root=Path('.')
          def read(p): return Path(p).read_text()
          def write(p,s): Path(p).write_text(s)
          def once(s,a,b,name):
              if a not in s: raise SystemExit('missing '+name)
              return s.replace(a,b,1)

          # Add a real action select to ffuf so its direct route has human-readable presets.
          p=Path('data/tool-builders.js')
          s=read(p)
          s=once(s,"fields:[{id:'url',label:'URL containing FUZZ',type:'text'","fields:[{id:'action',label:'Fuzzing action',type:'select',default:'content',options:[{value:'content',label:'Content/path fuzz'},{value:'vhost',label:'Virtual-host fuzz'},{value:'recursion',label:'Recursive content sweep'}]},{id:'url',label:'URL containing FUZZ',type:'text'",'ffuf action field')
          s=once(s,"tokens:[{kind:'field',field:'url',flag:'-u'}","tokens:[{kind:'choice',field:'action',choices:[{value:'content',arg:''},{value:'vhost',arg:''},{value:'recursion',arg:''}]},{kind:'field',field:'url',flag:'-u'}",'ffuf action token')
          write(p,s)

          # Add no-op action selectors to the v10.09 web scan builders. The selectors drive guidance/presets; command shape remains minimal until the operator changes real command fields.
          p=Path('data/tool-builders-web-scan-current.js')
          s=read(p)
          s=once(s,"fields:[\n  {id:'target',label:'Authorized URL / host'","fields:[\n  {id:'action',label:'Fingerprint action',type:'select',default:'fingerprint',options:[{value:'fingerprint',label:'Fast fingerprint'},{value:'deep',label:'Deeper fingerprint'},{value:'json-output',label:'Fingerprint with JSON output'}]},\n  {id:'target',label:'Authorized URL / host'",'whatweb action field')
          s=once(s,"tokens:[\n  {kind:'field',field:'aggression',flag:'-a'},","tokens:[\n  {kind:'choice',field:'action',choices:[{value:'fingerprint',arg:''},{value:'deep',arg:''},{value:'json-output',arg:''}]},\n  {kind:'field',field:'aggression',flag:'-a'},",'whatweb action token')
          s=once(s,"fields:[\n  {id:'host',label:'Authorized host / URL'","fields:[\n  {id:'action',label:'Scan action',type:'select',default:'default',options:[{value:'default',label:'Default host scan'},{value:'ssl-target',label:'SSL/alternate port scan'},{value:'focused-output',label:'Focused output capture'}]},\n  {id:'host',label:'Authorized host / URL'",'nikto action field')
          s=once(s,"tokens:[\n  {kind:'field',field:'host',flag:'-h'},","tokens:[\n  {kind:'choice',field:'action',choices:[{value:'default',arg:''},{value:'ssl-target',arg:''},{value:'focused-output',arg:''}]},\n  {kind:'field',field:'host',flag:'-h'},",'nikto action token')
          s=once(s,"fields:[\n  {id:'mode',label:'Input mode',type:'select',default:'single'","fields:[\n  {id:'action',label:'Probe action',type:'select',default:'single',options:[{value:'single',label:'Single endpoint probe'},{value:'probe-list',label:'Probe URL list'},{value:'enriched-json',label:'Enriched JSON capture'}]},\n  {id:'mode',label:'Input mode',type:'select',default:'single'",'httpx action field')
          s=once(s,"tokens:[\n  {kind:'field',field:'url',flag:'-u',when:{field:'mode',equals:'single'}},","tokens:[\n  {kind:'choice',field:'action',choices:[{value:'single',arg:''},{value:'probe-list',arg:''},{value:'enriched-json',arg:''}]},\n  {kind:'field',field:'url',flag:'-u',when:{field:'mode',equals:'single'}},",'httpx action token')
          s=once(s,"fields:[\n  {id:'target',label:'Authorized host/IP for default path fuzzing'","fields:[\n  {id:'action',label:'Fuzz action',type:'select',default:'path',options:[{value:'path',label:'Default path fuzz'},{value:'custom',label:'Custom FUZZ URL'},{value:'filtered',label:'Filtered result triage'}]},\n  {id:'target',label:'Authorized host/IP for default path fuzzing'",'wfuzz action field')
          s=once(s,"tokens:[\n  {kind:'field',field:'wordlist',flag:'-w'},","tokens:[\n  {kind:'choice',field:'action',choices:[{value:'path',arg:''},{value:'custom',arg:''},{value:'filtered',arg:''}]},\n  {kind:'field',field:'wordlist',flag:'-w'},",'wfuzz action token')
          s=once(s,"fields:[\n  {id:'mode',label:'ZAP mode',type:'select',default:'baseline'","fields:[\n  {id:'action',label:'ZAP action',type:'select',default:'baseline',options:[{value:'baseline',label:'Baseline scan handoff'},{value:'quick',label:'Quick scan handoff'},{value:'report-review',label:'Report review handoff'}]},\n  {id:'mode',label:'ZAP mode',type:'select',default:'baseline'",'zap action field')
          s=once(s,"tokens:[\n  {kind:'field',field:'target',flag:'-t',when:{field:'mode',equals:'baseline'}},","tokens:[\n  {kind:'choice',field:'action',choices:[{value:'baseline',arg:''},{value:'quick',arg:''},{value:'report-review',arg:''}]},\n  {kind:'field',field:'target',flag:'-t',when:{field:'mode',equals:'baseline'}},",'zap action token')
          write(p,s)

          # Generic renderer: attach owner profiles to effective builders and render action preset guidance as real controls.
          p=Path('assets/tool-builder-current.js')
          s=read(p)
          s=once(s,"function schema(){return root.OBOL_TOOL_BUILDER_SCHEMA||null;}\nfunction effectiveBuilder(builder){","function schema(){return root.OBOL_TOOL_BUILDER_SCHEMA||null;}\nfunction ownerProfileFor(builderId){\n const keys=Object.keys(root||{});\n for(const key of keys){const owner=root[key];if(owner&&owner.profiles&&owner.profiles[builderId])return owner.profiles[builderId];}\n return null;\n}\nfunction effectiveBuilder(builder){",'owner profile helper')
          s=once(s," return changed?{...builder,fields,command:{...builder.command,tokens}}:builder;\n}\nfunction esc", " const profile=ownerProfileFor(builder.id);\n const operatorGuide=(builder&&builder.operatorGuide)||(profile&&profile.operatorGuide)||null;\n if(changed||operatorGuide){const copy={...builder,fields,command:{...builder.command,tokens}};if(operatorGuide)copy.operatorGuide=operatorGuide;return copy;}\n return builder;\n}\nfunction esc",'effective builder guide merge')
          render = r"""
function renderOperatorGuide(builder,values){
 const guide=builder&&builder.operatorGuide;if(!guide)return'';
 const starts=Array.isArray(guide.startHere)?guide.startHere:[];
 const actions=Array.isArray(guide.actions)?guide.actions:[];
 const field=guide.actionField||'action';
 const current=values&&values[field];
 const startHtml=starts.length?'<ul class="tool-builder-start-here">'+starts.map(item=>'<li>'+esc(item)+'</li>').join('')+'</ul>':'';
 const buttons=actions.length?'<div class="tool-builder-action-presets" data-tool-builder-action-presets="'+esc(field)+'">'+actions.map(action=>'<button type="button" class="lane-tab tool-builder-action-preset'+(String(action.value)===String(current)?' active':'')+'" data-tool-builder-preset-field="'+esc(field)+'" data-tool-builder-preset="'+esc(action.value)+'"><b>'+esc(action.label||action.value)+'</b><span>'+esc(action.risk||'normal')+'</span></button>').join('')+'</div>':'';
 const active=actions.find(action=>String(action.value)===String(current))||actions[0]||null;
 const activeHtml=active?'<div class="tool-builder-action-context"><p class="hint"><b>Use when:</b> '+esc(active.useWhen||'')+'</p><p class="hint"><b>Requires:</b> '+esc(active.requires||'')+'</p><p class="hint"><b>What it can prove:</b> '+esc(active.proves||'')+'</p><p class="hint"><b>What it does not prove:</b> '+esc(active.notProve||'')+'</p><p class="hint"><b>Paste back:</b> '+esc(active.evidence||'')+'</p><p class="hint"><b>Next:</b> '+esc(active.next||'')+'</p></div>':'';
 return '<section class="tool-builder-guide" data-tool-builder-guide="'+esc(builder.id)+'"><h4>Action guide</h4><p class="hint">'+esc(guide.summary||'')+'</p>'+startHtml+buttons+activeHtml+'</section>';
}
"""
          s=once(s,"function html(builder,context,values){",render+"\nfunction html(builder,context,values){",'render guide function')
          s=once(s,"'</div><span class=\"badge\">'+esc(builder.executionContext||'any')+'</span></div>'+creds+\n  '<form class=\"tool-builder-form\" novalidate>'+fields+'</form>'+ ","'</div><span class=\"badge\">'+esc(builder.executionContext||'any')+'</span></div>'+creds+renderOperatorGuide(builder,resolved)+\n  '<form class=\"tool-builder-form\" novalidate>'+fields+'</form>'+ ",'html guide insertion')
          s=once(s," const copy=shell&&shell.querySelector('.tool-builder-copy');\n function refresh(){"," const copy=shell&&shell.querySelector('.tool-builder-copy');\n const presets=shell?Array.from(shell.querySelectorAll('[data-tool-builder-preset]')):[];\n function refresh(){",'preset query')
          s=once(s," if(form)form.addEventListener('change',refresh);\n if(copy)copy.addEventListener('click',()=>{"," if(form)form.addEventListener('change',refresh);\n presets.forEach(button=>button.addEventListener('click',()=>{if(!form)return;const field=button.dataset.toolBuilderPresetField||'action';const value=button.dataset.toolBuilderPreset;const el=form.elements&&form.elements.namedItem(field);if(!el)return;el.value=value;try{el.dispatchEvent(new Event('change',{bubbles:true}));}catch(_err){}refresh();}));\n if(copy)copy.addEventListener('click',()=>{",'preset click binding')
          write(p,s)

          owner = r"""'use strict';
(function(root){
const VERSION='v10.20-web-guidance-repair';
const IDS=Object.freeze(['tb-ffuf','tb-gobuster-ferox','tb-curl','tb-sqlmap','tb-burp-suite','tb-whatweb','tb-nikto','tb-httpx','tb-wfuzz','tb-zap']);
function arr(v){return Array.isArray(v)?v:[];}
function freeze(v){return Object.freeze(v);}
function action(value,label,useWhen,requires,proves,notProve,risk,next,evidence){return freeze({value,label,useWhen,requires,proves,notProve,risk:risk||'normal',next,evidence});}
function guide(summary,actionField,startHere,actions){return freeze({summary,actionField,startHere:freeze(startHere),actions:freeze(actions)});}
function profile(id,tool,purpose,why,neighbors,guideObj,controls){return freeze({
 operatorPurpose:purpose,
 whyChooseThisTool:why,
 nearestNeighbors:freeze(neighbors),
 requiredInputs:freeze(['authorized target or saved request material','explicit human-selected action','wordlist, header, cookie, proxy, or output path only when the selected action needs it']),
 curatedModes:freeze(arr(guideObj.actions).map(a=>a.label)),
 curatedControls:freeze(controls||['target or request source','action selector','filters or matchers','headers and cookies','proxy and timing','output artifact']),
 dangerousOrNoisyControls:freeze(['high request volume','recursive discovery','scanner confidence claims','authenticated headers or cookies','broad dump or crawl actions']),
 minimumViableCommandOrHandoff:'Start from the smallest request, scan, or GUI handoff that answers the selected web question. Add filters, headers, auth material, proxying, recursion, or output only when the operator chooses them.',
 evidenceSuccess:'Reviewed output showing status, title, headers, discovered path or host, scanner finding, injection observation, or request and response difference.',
 evidenceFailureBlockedPartial:'Timeouts, refused connections, WAF or auth blocks, empty results, noisy baselines, and partial output should be returned as Evidence too.',
 factsItCanProve:'Observed web endpoint, response metadata, discovered content, fingerprint lead, scanner finding, or replay result, limited to what the output directly shows.',
 factsItCannotProve:'Exploitability, authorization bypass, credential validity, sensitive data access, code execution, or compromise without independent follow-up output.',
 nextStepsMovementOrBlocking:'Move, block, or re-arm Next Steps only from reviewed Evidence after the operator runs the command or completes the GUI workflow.',
 cleanupAndReportingNotes:'Report target, request shape, action, filters, auth context if relevant, output artifact, and redacted result lines.',
 routeRegression:'Build 3 Web discovery and HTTP operator-guidance repair.',
