  action('dir','Directory/file discovery','Use for classic web paths and extension checks.','Target URL, wordlist, and optional extensions.','Path candidates and response metadata.','Access to content or exploitability.','normal','Replay useful paths and tune filters.','Paste discovered paths and status/size context.'),
  action('vhost','Virtual-host discovery','Use for name-based sites on the same host.','Base URL or host plus a vhost wordlist.','Candidate hostnames with response deltas.','That the vhost exposes useful data.','normal','Confirm with Host header or browser request.','Paste host candidates and baseline response.'),
