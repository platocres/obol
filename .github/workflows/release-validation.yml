name: Obol release validation

on:
  push:
    branches:
      - 'release/**'

concurrency:
  group: obol-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run lightweight release smoke validation
        run: node tools/release-smoke.js
      - name: Run release preflight
        if: contains(github.event.head_commit.message, '[preflight]') || contains(github.event.head_commit.message, '[release-final]')
        run: node tools/release-preflight.js
      - name: Validate all JavaScript syntax
        if: contains(github.event.head_commit.message, '[release-final]')
        run: find assets data tools tests -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Validate historical test future safety
        if: contains(github.event.head_commit.message, '[release-final]')
        run: node tools/validate-historical-tests.js
      - name: Validate release contract
        if: contains(github.event.head_commit.message, '[release-final]')
        run: node tools/validate-release-pr.js
      - name: Run complete historical regression chain
        if: contains(github.event.head_commit.message, '[release-final]')
        run: |
          set -euo pipefail
          node tests/run-tests.js
          while IFS= read -r file; do
            node "$file"
          done < <(find tests -maxdepth 1 -type f -name 'run-v*-tests.js' -print | sort -V)
      - name: Check release quality debt
        if: contains(github.event.head_commit.message, '[release-final]')
        run: node tools/validate-release-quality.js
      - name: Check README Build Next synchronization
        if: contains(github.event.head_commit.message, '[release-final]')
        run: node tools/sync-readme-build-next.js --check
      - name: Check Product Build Next synchronization
        if: contains(github.event.head_commit.message, '[release-final]')
        run: node tools/sync-product-build-next.js --check

# Release branches intentionally use one visible job. Ordinary commits run smoke only;
# [preflight] adds the current-release gate; [release-final] adds the complete historical
# chain. PR-required checks live in .github/workflows/tests.yml so pull requests do not
# show skipped release-only jobs as noisy check rows.
