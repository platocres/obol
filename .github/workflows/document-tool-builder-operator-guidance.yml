name: Document Tool Builder operator guidance queue

on:
  push:
    branches:
      - tool-builder-operator-guidance-repair

permissions:
  contents: write

jobs:
  document:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tool-builder-operator-guidance-repair
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Write queue and handoff docs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          doc = Path('docs/TOOL-BUILDER-OPERATOR-GUIDANCE-AUDIT.md')
          doc.write_text("""# Tool Builder operator-guidance audit and repair

This document is the handoff for the Tool Builder problem Brandon found while inspecting the first database acceleration tools after PRs #255 and #256.

## Why this exists

The shared Tool Builder plumbing pilot made the implementation mechanics more reusable, but inspection of `#/tools/mysql` and `#/tools/psql` showed that a route can be technically implemented and still not be good enough for a human operator.

The failure pattern was not limited to one database tool. It exposed a contract gap for all implemented builders:

- The page did not clearly teach when to use the tool or which action to pick.
- "Pickable modes and presets" looked clickable, but the chips did not change the selected builder mode or command.
- The database builders exposed too few useful operator actions, mostly connect/query/list variants.
- Common database follow-through, such as privilege checks, scoped enumeration, file capability checks, and database-backed OS command execution checks, was not surfaced as a guided path.
- Related legacy examples appeared too prominently and could dominate the direct tool route.
- Empty sections such as Recommended accessories rendered even when there was no useful content.
- Native selects and checkboxes looked unfinished, and the mobile command preview allowed the validation state to collide with the Generated command label.
- The mined notes were not being converted into enough plain-language operator instruction.

Brandon should not have to critique every tool by hand. Treat this as a pattern-level blocker.

## Immediate queue rule

Do not continue broad modeled-tool acceleration until implemented builders have an operator-guidance contract and the current implemented builders are audited against it.

The next Tool Builder work should be a repair and audit sequence, not another tool-count sprint.

## Required implemented-builder contract

An implemented builder must answer these questions before it counts as done:

- What situation is the operator in?
- When should this tool be chosen over nearby tools?
- What should the operator try first?
- What human-readable action presets are available?
- What command or handoff does each preset generate?
- What inputs are required, and why?
- What output proves success, failure, blocked, partial, or inconclusive state?
- What does the output not prove?
- What risky or noisy actions exist, and what preconditions gate them?
- What should be pasted back into Evidence?
- How can that Evidence move, block, re-arm, or deprioritize Next Steps?
- What cleanup or report notes should the operator keep?

Command generation alone is not enough. A route that renders a form but does not teach the operator what to do with it is not complete.

## Database-specific repair expectations

The database owner is the first failing family and should be repaired first.

### PostgreSQL / `psql`

Expected action presets should include, at minimum:

- Test connection and identity.
- List databases.
- List schemas.
- List tables.
- Describe a table.
- Run one scoped SQL query.
- Show role privileges.
- Check superuser or server-program privilege.
- Check `COPY PROGRAM` capability.
- Generate a gated `COPY PROGRAM` command-execution probe.

The command-execution path must explain that it runs from the database server context, requires server-side program execution privilege, and should begin with small proof commands such as identity or hostname checks before any shell attempt.

### MySQL / MariaDB / `mysql`

Expected action presets should include, at minimum:

- Test connection and identity.
- List databases.
- List tables.
- Describe a table.
- Read scoped rows.
- Show grants.
- Check FILE privilege.
- Check `secure_file_priv`.
- Try a gated `LOAD_FILE` read.
- Assess UDF/plugin command-execution preconditions without pretending command execution is automatic.

The command-execution path must explain that MySQL OS command execution usually depends on privileges and server/plugin filesystem conditions, not merely a normal SQL prompt.

### MSSQL / `impacket-mssqlclient`

Expected action presets should include, at minimum:

- Test login and identity.
- Show SQL Server version.
- List databases.
- Run one scoped query.
- Check server role and sysadmin state.
- Check `xp_cmdshell` status.
- Generate a gated enable-`xp_cmdshell` command.
- Generate a gated `xp_cmdshell whoami` probe.
- Generate a gated custom `xp_cmdshell` command.

The dangerous path must be explicit and evidence-gated. Generated `xp_cmdshell` text is not proof of OS command execution until output is pasted back and parsed.

### Redis / `redis-cli`

Expected action presets should include, at minimum:

- PING service proof.
- INFO summary.
- Auth/ACL check.
- Keyspace summary.
- Scoped key read.
- `CONFIG GET dir` and `dbfilename` checks.
- Write/persistence risk assessment with explicit proof boundaries.

Dangerous write/persistence paths should be separated from normal enumeration and should not imply host compromise without independent Evidence.

### Oracle / `odat`

Expected action presets should include, at minimum:

- Find SID/service.
- Validate credentials.
- Run TNS command checks.
- Enumerate privileges.
- Check file capability.
- Check scheduler or external-job style command capability where the module and permissions support it.

## UI repair expectations

The direct Tools route must be changed so implemented builders are usable on mobile and desktop:

- Replace fake preset chips with real controls that change builder state, or render them as non-clickable summaries.
- Add a Start here or What are you trying to learn section above the form.
- Move legacy examples below the actual builder guidance and keep them collapsed by default.
- Hide empty Recommended accessories sections.
- Fix command-preview wrapping so validation text never collides with labels.
- Style selects and checkboxes so they fit the Obol surface instead of raw browser defaults.
- Use mined-note knowledge as rewritten context and instruction, not private source text or rote copied note fragments.

## Required tests

Add tests before calling the repair done:

- A Node contract test that fails any implemented builder without operator guidance and action presets.
- A browser interaction test that taps or selects presets and proves the builder mode/command changes.
- A mobile visual/layout test for command-preview validation wrapping.
- A regression that proves empty accessory sections do not render.
- A regression that proves legacy examples are collapsed below guidance.
- Database-specific tests that prove privilege/capability/command-exec action presets exist with proof boundaries.
- Evidence tests for the new database action outputs, including success, failure, blocked, partial, and inconclusive states.

## Recommended build sequence

1. Tool direct-route usability repair and database operator guidance repair.
2. Implemented-builder audit ledger against the new contract.
3. Family repair batches for any failing existing implemented builders.
4. Resume modeled-tool acceleration only after implemented builders stop failing the guidance/preset/mobile contract.

## Non-goals

- Do not add more modeled tools in the same build as the initial guidance repair.
- Do not re-mine all private notes from zero.
- Do not expose raw private note content.
- Do not create generic database mega-tools that smear together distinct tools.
- Do not claim database command execution from generated commands alone.
- Do not turn Obol into an automatic executor.

Obol remains browser-local and human-run. The tool builder should make the operator's next decision obvious, generate the selected command or handoff, and require pasted Evidence before proving anything.
""", encoding='utf-8')

          queue = Path('docs/TOOL-BUILDER-BUILD-QUEUE.md')
          q = queue.read_text(encoding='utf-8')
          contract = "> A tool is also not fully implemented until its direct Tools route teaches the operator what situation the tool fits, which human-readable action to pick, what the generated command proves or does not prove, what risky/noisy paths require, and what output should be pasted back into Evidence. Fake clickable preset chips, empty accessory sections, raw legacy-example dumps, and command-only forms are not acceptable implemented-builder UX.\n\n"
          anchor = "> A tool is not fully implemented merely because Obol can generate its command. Every implemented tool must also have an Evidence-ingestion contract for the decision-relevant output that tool can produce, conservative fact extraction, failure/partial-result handling, and Next Steps movement or blocking where that Evidence changes what the operator should do next.\n\n"
          if contract not in q:
              q = q.replace(anchor, anchor + contract)
          active_anchor = "## Active Tool Builder batches\n\n"
          section = """### Implemented Tool Builder operator-guidance audit and repair

This is now the first active Tool Builder build before any more broad modeled-tool acceleration.

Brandon inspected the database builders from the acceleration pilot and found a pattern-level failure: implemented routes existed, but the tool pages did not sufficiently teach what to do, which action to choose, why that action matters, what output proves, what output does not prove, or how database-backed command execution paths should be checked safely. The preset chips also looked clickable without changing builder state, empty accessory sections rendered, legacy examples dominated the page, and mobile command validation text collided with the command-preview label.

Read [`docs/TOOL-BUILDER-OPERATOR-GUIDANCE-AUDIT.md`](TOOL-BUILDER-OPERATOR-GUIDANCE-AUDIT.md) before building. That document is the handoff for this repair and contains the database-specific action paths, UI expectations, test requirements, and follow-up audit sequence.

Acceptance for this batch:

- Implemented builders have an operator-guidance contract, not just command generation.
- Direct tool routes explain when to use the tool, what to try first, which action preset to pick, what output proves, what remains unproved, and what Evidence to paste back.
- Action presets are real controls that mutate builder state and command previews, or they are restyled as non-clickable explanatory summaries.
- Database builders get meaningful human-readable action presets for identity, listing, table/schema navigation, privilege/capability checks, scoped reads, and gated database-to-OS command execution paths where the database/tool supports them.
- Risky actions such as `COPY PROGRAM`, `xp_cmdshell`, Redis write/persistence paths, MySQL UDF/plugin paths, and Oracle scheduler/external-job style paths are explicit, gated, and proof-boundary labeled.
- Empty accessories do not render.
- Legacy examples are collapsed below guidance and never dominate the primary direct-tool route.
- Mobile command preview and missing-field states do not collide visually.
- Regression tests fail any implemented builder that lacks operator guidance, real presets, preset interaction behavior, Evidence interpretation, and mobile-safe command validation.
- A follow-up implemented-builder audit ledger is created or queued so Brandon does not have to inspect every currently implemented tool manually.

Do not resume new modeled-tool promotion until this guidance/preset/mobile contract is in place and the existing implemented-builder surface has an audit path.

"""
          if '### Implemented Tool Builder operator-guidance audit and repair' not in q:
              q = q.replace(active_anchor, active_anchor + section)
          queue.write_text(q, encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          old = "For Tool Builder work, [`docs/TOOL-BUILDER-BUILD-QUEUE.md`](docs/TOOL-BUILDER-BUILD-QUEUE.md) and [`docs/TOOL-BUILDER-IMPLEMENTATION-STANDARD.md`](docs/TOOL-BUILDER-IMPLEMENTATION-STANDARD.md) are mandatory."
          new = "For Tool Builder work, [`docs/TOOL-BUILDER-BUILD-QUEUE.md`](docs/TOOL-BUILDER-BUILD-QUEUE.md), [`docs/TOOL-BUILDER-IMPLEMENTATION-STANDARD.md`](docs/TOOL-BUILDER-IMPLEMENTATION-STANDARD.md), and [`docs/TOOL-BUILDER-OPERATOR-GUIDANCE-AUDIT.md`](docs/TOOL-BUILDER-OPERATOR-GUIDANCE-AUDIT.md) are mandatory."
          r = r.replace(old, new)
          old = "The completed broad audit item was **Post-mining Next Steps and tool-card clarity audit**. The **Implemented-tool Evidence and cross-surface audit** is complete. The **Remaining modeled tool implementation backlog.** remains active until each modeled tool is implemented through the full Tool Builder contract or explicitly dispositioned with proof."
          new = "The completed broad audit item was **Post-mining Next Steps and tool-card clarity audit**. The **Implemented-tool Evidence and cross-surface audit** is complete, but Brandon's direct inspection found a newer operator-guidance failure pattern. The next Tool Builder work is the implemented-builder operator-guidance audit and repair in [`docs/TOOL-BUILDER-OPERATOR-GUIDANCE-AUDIT.md`](docs/TOOL-BUILDER-OPERATOR-GUIDANCE-AUDIT.md); pause broad modeled-tool acceleration until implemented builders have real action presets, meaningful context, mobile-safe command previews, and a follow-up audit ledger. The **Remaining modeled tool implementation backlog** remains active after that repair until each modeled tool is implemented through the full Tool Builder contract or explicitly dispositioned with proof."
          r = r.replace(old, new)
          canon = "- [`docs/TOOL-BUILDER-IMPLEMENTATION-STANDARD.md`](docs/TOOL-BUILDER-IMPLEMENTATION-STANDARD.md) - reusable-plumbing / bespoke-profile standard for faster Tool Builder implementation without generic tool smearing.\n"
          add = canon + "- [`docs/TOOL-BUILDER-OPERATOR-GUIDANCE-AUDIT.md`](docs/TOOL-BUILDER-OPERATOR-GUIDANCE-AUDIT.md) - mandatory repair/audit handoff for implemented builders that lack meaningful operator guidance, real presets, database action paths, and mobile-safe UX.\n"
          if 'TOOL-BUILDER-OPERATOR-GUIDANCE-AUDIT.md' not in r:
              r = r.replace(canon, add)
          readme.write_text(r, encoding='utf-8')

          standard = Path('docs/TOOL-BUILDER-IMPLEMENTATION-STANDARD.md')
          s = standard.read_text(encoding='utf-8')
          add = """
## Operator guidance is now part of implementation

Shared plumbing and bespoke profiles are not enough if the direct Tools route still behaves like a command vending machine. An implemented builder must teach the operator what situation they are in, why this tool is appropriate, what action preset to choose, what each action proves, what it does not prove, and what output belongs in Evidence.

Every future Tool Builder slice must keep this line intact:

- Shared code owns mechanics.
- Tool profiles own judgment.
- Operator guidance owns the human decision path.

A builder route fails the standard when it has fake clickable presets, non-working mode chips, empty accessory cards, raw native controls that look unfinished, legacy examples dominating the primary route, or too few meaningful actions for the real operator workflow. Database builders must explicitly cover identity, enumeration, privilege/capability checks, scoped reads, and gated database-to-OS command execution paths where the underlying database/tool supports them. See `docs/TOOL-BUILDER-OPERATOR-GUIDANCE-AUDIT.md` for the active repair queue and audit requirements.
"""
          if '## Operator guidance is now part of implementation' not in s:
              s = s.rstrip() + '\n\n' + add.lstrip()
          standard.write_text(s, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          if changelog.exists():
              c = changelog.read_text(encoding='utf-8')
              entry = """## Unreleased

- Documented the implemented Tool Builder operator-guidance failure pattern found during database builder inspection and queued the repair/audit sequence before further modeled-tool acceleration.
- Added `docs/TOOL-BUILDER-OPERATOR-GUIDANCE-AUDIT.md` as the handoff for real action presets, database action paths, mobile command-preview repair, legacy-example containment, and the implemented-builder audit ledger.

"""
              if 'TOOL-BUILDER-OPERATOR-GUIDANCE-AUDIT.md' not in c.split('\n\n', 2)[0:2]:
                  if c.startswith('# Changelog\n\n'):
                      c = c.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
                  else:
                      c = entry + c
                  changelog.write_text(c, encoding='utf-8')
          PY
      - name: Commit docs and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md docs/TOOL-BUILDER-BUILD-QUEUE.md docs/TOOL-BUILDER-IMPLEMENTATION-STANDARD.md docs/TOOL-BUILDER-OPERATOR-GUIDANCE-AUDIT.md
          git commit -m "[docs] Queue Tool Builder operator guidance repair"
          git rm .github/workflows/document-tool-builder-operator-guidance.yml
          git commit -m "[docs] Remove temporary guidance queue workflow"
          git push