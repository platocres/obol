name: Agent changelog audit ledger patch

on:
  push:
    branches:
      - tool-builder-implemented-audit-ledger

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tool-builder-implemented-audit-ledger
      - name: Patch changelog
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text()
          marker='## v10.20'
          bullets='''- Added the Build 2 implemented-builder audit ledger so currently registered implemented builders are grouped into pass/fail repair families, with database builders passing and older implemented builders failing visibly until their direct-route guidance is repaired.
- Clarified that direct Tools routes must not proof-gate command generation; Evidence gates proof claims and Next Steps movement after execution, not action selection or command preview generation.
'''
          if 'Build 2 implemented-builder audit ledger' not in s:
              if marker not in s:
                  raise SystemExit('v10.20 heading not found')
              s=s.replace(marker, marker+'\n\n'+bullets, 1)
          p.write_text(s)
          PY
      - name: Commit changelog patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-changelog-audit-ledger-patch.yml
          git add CHANGELOG.md
          git commit -m "Update changelog for implemented audit ledger"
          git push origin tool-builder-implemented-audit-ledger
