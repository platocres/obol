name: Wire Obol v4.9 release

on:
  push:
    branches:
      - release/obol-v4.9

permissions:
  contents: write

jobs:
  wire:
    if: github.event.head_commit.message == 'Wire Obol v4.9 release files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/obol-v4.9
          fetch-depth: 0
      - name: Wire release
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<title>Obol v4.8 — Offensive Box Operations Ledger</title>','<title>Obol v4.9 — Offensive Box Operations Ledger</title>')
          if 'Obol v4.8 compatibility marker retained for regression' not in s:
              marker='<!-- Obol v4.7 compatibility marker retained for regression: Offensive Box Operations Ledger · v4.7 -->'
              s=s.replace(marker,marker+'\n<!-- Obol v4.8 compatibility marker retained for regression: Offensive Box Operations Ledger · v4.8 -->')
          s=s.replace('<link rel="stylesheet" href="assets/obol-v4.8.css">','<link rel="stylesheet" href="assets/obol-v4.8.css">\n<link rel="stylesheet" href="assets/obol-v4.9.css">')
          s=s.replace('Offensive Box Operations Ledger · v4.8</p>','Offensive Box Operations Ledger · v4.9</p>')
          s=s.replace('<script src="data/methodology-v4.8.js"></script>','<script src="data/methodology-v4.8.js"></script>\n<script src="data/dashboard-v4.9.js"></script>')
          s=s.replace('<script src="assets/core-v4.8.js"></script>','<script src="assets/core-v4.8.js"></script>\n<script src="assets/core-v4.9.js"></script>')
          s=s.replace('<script src="assets/app-v4.8.js"></script>','<script src="assets/app-v4.8.js"></script>\n<script src="assets/app-v4.9.js"></script>')
          p.write_text(s)

          p=Path('README.md')
          s=p.read_text()
          section='''## Obol v4.9\n\nv4.9 is the **single North Star dashboard** release.\n\nIt directly implements the v4.8 README requirement that all of Obol's Orange Cyberdefense methodology work, tool decisions, command UX, copy/paste Evidence handling, Next Steps integration, Kali/Windows execution metadata, and reporting traceability be tracked in **a single dashboard** on the website with **hard numbers and percentages**.\n\nHome now owns one consolidated project dashboard instead of scattering project-health status across multiple Orange/SCCM/persistence cards. The dashboard uses live repository state and shows raw counts beside every percentage for canonical methodology completion, represented coverage, Run → Evidence loop readiness, explicit Evidence profiles, explicit execution-side metadata, decision-path mapping, reporting traceability, and structured tool-choice review. It also shows mapped command counts, GUI-adjustable versus intentionally fixed commands, active-context Orange progress, report proof readiness, canonical backlog concentration, and strict release-to-release methodology trend.\n\nThe dashboard composes the existing audit systems rather than creating a competing denominator. Fixed commands are not automatically treated as defects, partial Orange coverage does not count as fully implemented, and parser/reporting/dashboard work does not inflate the 127-section methodology denominator.\n\nv4.9 is accounting and UX infrastructure, so the strict live canonical baseline remains:\n\n- **52 / 127 canonical sections fully implemented**\n- **49 partial**\n- **26 explicit gaps**\n- **0 stale implemented mappings**\n- **41% fully implemented**\n- **80% represented**\n\nSee `docs/v4.9.md` for the dashboard contract and metric semantics.\n\n'''
          if '## Obol v4.9' not in s:
              s=s.replace('## Obol v4.8',section+'## Obol v4.8',1)
          foundation='- Single Home North Star dashboard with hard counts and percentages across methodology, operator-loop, Evidence, execution metadata, Next Steps mapping, tool review, reporting traceability, active-context progress, and canonical backlog.\n'
          needle='- Domain-persistence branch depth with dedicated ticket, DSRM, CA, credential-subsystem, DCShadow, ACL lifecycle, Evidence, cleanup, and reporting contracts.\n'
          if foundation.strip() not in s and needle in s:
              s=s.replace(needle,needle+foundation,1)
          completed='''Completed or materially advanced in v4.9:\n\n- Add one Home North Star dashboard that tracks the project-wide requirements with hard counts and percentages.\n- Consolidate canonical Orange completion, represented coverage, run/Evidence loop readiness, Evidence-profile coverage, execution-side metadata, decision-path mapping, reporting traceability, and structured tool review.\n- Show raw denominators beside percentages so project health cannot drift into flattering or ambiguous scores.\n- Add active-context Orange stage, grounded queue, mapped-success, report-proof, SCCM, and persistence visibility inside the same dashboard.\n- Add canonical backlog concentration by Orange source file with direct Methodology drill-down.\n- Add strict release trend from the v4.2 canonical denominator through the current v4.9 live state.\n- Keep GUI-adjustable versus intentionally fixed command counts separate instead of treating fixed commands as automatic defects.\n- Preserve the strict 52/49/26/0 Orange methodology baseline and every existing North Star requirement.\n\n'''
          if 'Completed or materially advanced in v4.9:' not in s:
              s=s.replace('Completed or materially advanced in v4.8:',completed+'Completed or materially advanced in v4.8:',1)
          if 'node tests/run-v4.9-tests.js' not in s:
              s=s.replace('node tests/run-v4.8-tests.js','node tests/run-v4.8-tests.js\nnode tests/run-v4.9-tests.js')
          if 'The v4.9 suite adds the unified North Star dashboard' not in s:
              anchor='GitHub Actions runs the complete regression chain on `main`, release branches, and pull requests.'
              add='The v4.9 suite adds the unified North Star dashboard, hard-number metric accounting, broad execution-metadata audit, tool-review percentages, active-context isolation, and canonical backlog tracking.\n\n'
              s=s.replace(anchor,add+anchor,1)
          p.write_text(s)
          PY
          git config user.name "platocres"
          git config user.email "49848326+platocres@users.noreply.github.com"
          git add README.md index.html
          git commit -m "Wire Obol v4.9 dashboard release"
          git push origin HEAD:release/obol-v4.9
