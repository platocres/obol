name: Patch Obol v4.8 README

on:
  push:
    branches:
      - release/obol-v4.8

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add Obol v4.8 README patcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/obol-v4.8
          fetch-depth: 0
      - name: Patch README
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text()
          section='''## Obol v4.8

v4.8 is the **domain persistence branch depth and lifecycle** release.

It directly advances the v4.7 README priority to expand domain persistence beyond Golden Ticket while enforcing the newer project-wide rule that every Orange-mapped workflow needs a usable run contract, conservative copy/paste Evidence handling, Kali/Windows execution context, Next Steps integration, cleanup semantics, and reporting traceability.

v4.8 adds dedicated persistence owners for **Silver Ticket**, **DSRM**, **Golden Certificate**, **credential-subsystem persistence (Skeleton Key / Custom SSP)**, **Diamond/Sapphire tickets**, **DCShadow**, and an **ACL persistence lifecycle** with explicit DACL backup and restore. Advanced target-dependent techniques remain partial rather than being overclaimed.

The new persistence branch follows the existing human-run operator loop:

`Next Steps → choose implementation → build/copy command → operator runs externally → paste Evidence → review facts/activity → recalculate Next Steps → report and clean up`

Terminal proof remains conservative. A saved forged ticket does not prove service access. CA backup does not automatically prove Golden Certificate persistence. DSRM requires explicit registry verification. Skeleton Key, Custom SSP, and DCShadow startup text remain attempted activity until explicit success output is present. ACL writes do not manufacture administrator state.

v4.8 also adds a context-scoped persistence lifecycle and a **Domain Persistence Lifecycle** report section so successful persistence work remains tied to canonical Orange provenance, Evidence family, proof readiness, and cleanup/remediation obligations.

The live canonical baseline moves from 48 / 45 / 34 / 0 to:

- **52 / 127 canonical sections fully implemented**
- **49 partial**
- **26 explicit gaps**
- **0 stale implemented mappings**
- **41% fully implemented**
- **80% represented**

See `docs/v4.8.md` for the full persistence branch contract.

'''
          if '## Obol v4.8' not in s:
              s=s.replace('## Obol v4.7',section+'## Obol v4.7',1)
          foundation='- Domain-persistence branch depth with dedicated ticket, DSRM, CA, credential-subsystem, DCShadow, ACL lifecycle, Evidence, cleanup, and reporting contracts.\n'
          needle='- Retroactive Orange reporting traceability from canonical decision path and Evidence profile through proof readiness and generated report output.\n'
          if foundation.strip() not in s and needle in s:
              s=s.replace(needle,needle+foundation,1)
          completed='''Completed or materially advanced in v4.8:\n\n- Add dedicated Silver Ticket, DSRM, Golden Certificate, credential-subsystem, advanced forged-ticket, DCShadow, and ACL-persistence lifecycle cards.\n- Add conservative copy/paste Evidence profiles for each new persistence workflow.\n- Add explicit Kali / Windows / target-local execution metadata and retain the single v4.0 execution-context contract.\n- Add persistence-focused Next Steps progress without adding a new primary navigation destination.\n- Add Domain Persistence Lifecycle reporting with cleanup/remediation notes.\n- Move Silver Ticket, DSRM, Golden Certificate, and ACL persistence to implemented while keeping Skeleton Key, Custom SSP, Diamond/Sapphire tickets, and DCShadow partial.\n- Raise strict Orange completion to 41% and represented coverage to 80% while preserving the pinned 127-section denominator.\n- Preserve every North Star, reporting, GUI-control, copy/paste Evidence, Next Steps, and Kali/Windows requirement.\n\n'''
          if 'Completed or materially advanced in v4.8:' not in s:
              s=s.replace('Completed or materially advanced in v4.7:',completed+'Completed or materially advanced in v4.7:',1)
          # Remove the persistence priority now materially advanced, and replace with remaining follow-up.
          s=s.replace('- Expand domain persistence beyond Golden Ticket into Silver Ticket, DSRM, Skeleton Key, Custom SSP, Golden Certificate, Diamond/Sapphire tickets, DCShadow, and persistence-specific ACL lifecycle.\n','- Deepen the v4.8 partial persistence workflows with broader target-version fixtures, exact cleanup validation, and stronger service-use proof where appropriate.\n')
          if 'node tests/run-v4.8-tests.js' not in s:
              s=s.replace('node tests/run-v4.7-tests.js','node tests/run-v4.7-tests.js\nnode tests/run-v4.8-tests.js')
          marker='The v4.8 suite adds domain-persistence branch depth, conservative persistence Evidence contracts, context-scoped persistence progress, and cleanup-aware report integration.\n\n'
          anchor='GitHub Actions runs the complete regression chain on `main`, release branches, and pull requests.'
          if marker.strip() not in s:
              s=s.replace(anchor,marker+anchor,1)
          p.write_text(s)
          PY
          git config user.name "platocres"
          git config user.email "49848326+platocres@users.noreply.github.com"
          git add README.md
          git commit -m "Document Obol v4.8 persistence branch"
          git push origin HEAD:release/obol-v4.8
