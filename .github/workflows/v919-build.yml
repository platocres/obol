name: Obol v9.19 build helper

on:
  push:
    branches:
      - release/obol-v9.19
    paths:
      - '.github/v919-build.js'
      - '.github/workflows/v919-build.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/obol-v9.19
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Escape Markdown code spans inside helper templates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('.github/v919-build.js')
          s=p.read_text()
          s=re.sub(r'`([^`\n]+)`', lambda m: '\\`'+m.group(1)+'\\`', s)
          p.write_text(s)
          PY
      - name: Apply v9.19 source changes
        run: node .github/v919-build.js
      - name: Validate prepared release
        run: |
          set -euo pipefail
          find assets data tools tests -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          node tools/validate-tool-builder-platform.js
          node tools/validate-product-hardening-queue.js
          node tests/run-v9.18-tests.js
          node tests/run-v9.19-tests.js
          node tools/sync-current-release.js --check
          node tools/sync-product-build-next.js --check
      - name: Commit v9.19 implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data docs tests
          git diff --cached --quiet && exit 0
          git commit -m 'Implement v9.19 sqlmap Tool Builder'
          git push origin HEAD:release/obol-v9.19
