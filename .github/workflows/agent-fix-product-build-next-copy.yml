name: Agent fix Product Build Next copy

on:
  push:
    branches:
      - release/obol-v10.20

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/obol-v10.20
      - name: Patch Product Build Next copy and remove temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          sync = Path('tools/sync-product-build-next.js')
          workflow = Path('.github/workflows/agent-fix-product-build-next-copy.yml')

          data = readme.read_text()
          old = '3. **Do Product Build Next.** The generated Product Build Next block below is the current queue authority for ChatGPT/product-hardening agents. Treat the highest-priority item as the entry point into the recommended coherent work package, not as a one-item limit.'
          new = '3. **Do Product Build Next.** Start with the highest-priority Product Build Next item. The generated Product Build Next block below is the current queue authority for ChatGPT/product-hardening agents. Treat the highest-priority item as the entry point into the recommended coherent work package, not as a one-item limit. Batch only closely related live items in the same ownership area. Every item advanced or closed still needs its own acceptance criteria and proof.'
          data = data.replace(old, new)
          old = 'Generated from the same queue sources as the Product Hardening Dashboard. Do not edit this block manually.\n'
          new = 'Generated from the same queue sources as the Product Hardening Dashboard. Do not edit this block manually.\nThis block is generated from `data/product-hardening/product-hardening-queue.js`. Do not edit it manually.\n'
          data = data.replace(old, new)
          old = '**Package detail:** Use the Product Hardening Dashboard for full track ledgers and `data/product-hardening/work-packages.js` for the long-form package guidance.\n'
          new = '**Package detail:** Use the Product Hardening Dashboard for full track ledgers and `data/product-hardening/work-packages.js` for the long-form package guidance.\nRecommended work-package metadata comes from `data/product-hardening/work-packages.js`.\n'
          data = data.replace(old, new)
          readme.write_text(data)

          data = sync.read_text()
          old = "    'Generated from the same queue sources as the Product Hardening Dashboard. Do not edit this block manually.',\n"
          new = "    'Generated from the same queue sources as the Product Hardening Dashboard. Do not edit this block manually.',\n    'This block is generated from `data/product-hardening/product-hardening-queue.js`. Do not edit it manually.',\n"
          data = data.replace(old, new)
          old = "    '**Package detail:** Use the Product Hardening Dashboard for full track ledgers and `data/product-hardening/work-packages.js` for the long-form package guidance.'\n"
          new = "    '**Package detail:** Use the Product Hardening Dashboard for full track ledgers and `data/product-hardening/work-packages.js` for the long-form package guidance.',\n    '**Recommended work-package metadata comes from `data/product-hardening/work-packages.js`.'\n"
          data = data.replace(old, new)
          sync.write_text(data)

          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md tools/sync-product-build-next.js .github/workflows/agent-fix-product-build-next-copy.yml
          git commit -m "Restore Product Build Next handoff copy" || exit 0
          git push
