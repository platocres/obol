name: Agent patch browser request budget

on:
  push:
    branches:
      - tool-builder-database-acceleration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-browser-budget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: tool-builder-database-acceleration
          fetch-depth: 0
      - name: Patch full browser smoke budgets for database owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/playwright-smoke.js')
          s=path.read_text()
          s=s.replace('// current owner, and the full Tools inventory visibility completion pass.','// current owner, the full Tools inventory visibility completion pass, and the database\n// Tool Builder acceleration current owner.')
          s=s.replace("{ id: 'evidence', hash: '#/intake', marker: /evidence/i, requestBudget: 92 }","{ id: 'evidence', hash: '#/intake', marker: /evidence/i, requestBudget: 93 }")
          s=s.replace("{ id: 'report', hash: '#/report', marker: /report/i, requestBudget: 86 }","{ id: 'report', hash: '#/report', marker: /report/i, requestBudget: 87 }")
          s=s.replace("{ id: 'dashboard', hash: '#/dashboard', marker: /Product Hardening/i, currentDashboard: true, settleMs: 5200, requestBudget: 86 }","{ id: 'dashboard', hash: '#/dashboard', marker: /Product Hardening/i, currentDashboard: true, settleMs: 5200, requestBudget: 87 }")
          path.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/agent-patch-browser-budget.yml
      - name: Validate patched smoke and database tests
        run: |
          node --check tests/playwright-smoke.js
          node --check data/product-hardening/database-tool-builders-current.js
          node --check tests/run-tool-builder-database-acceleration-tests.js
          node tests/run-tool-builder-database-acceleration-tests.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/playwright-smoke.js .github/workflows/agent-patch-browser-budget.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update browser budget for database tool owner"
          git push origin HEAD:tool-builder-database-acceleration
