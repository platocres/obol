name: Migrate Obol v5.0 release wiring

on:
  push:
    branches:
      - release/obol-v5.0

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Migrate v5.0 index and history tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/obol-v5.0
          fetch-depth: 0
      - name: Patch index and historical documentation assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html'); s=p.read_text()
          s=s.replace('<title>Obol v4.9 — Offensive Box Operations Ledger</title>','<title>Obol v5.0 — Offensive Box Operations Ledger</title>')
          if 'Obol v4.9 compatibility marker retained for regression' not in s:
              marker='<!-- Obol v4.8 compatibility marker retained for regression: Offensive Box Operations Ledger · v4.8 -->'
              s=s.replace(marker,marker+'\n<!-- Obol v4.9 compatibility marker retained for regression: Offensive Box Operations Ledger · v4.9 -->')
          s=s.replace('<link rel="stylesheet" href="assets/obol-v4.9.css">','<link rel="stylesheet" href="assets/obol-v4.9.css">\n<link rel="stylesheet" href="assets/obol-v5.0.css">')
          s=s.replace('Offensive Box Operations Ledger · v4.9</p>','Offensive Box Operations Ledger · v5.0</p>')
          s=s.replace('<script src="data/dashboard-v4.9.js"></script>','<script src="data/dashboard-v4.9.js"></script>\n<script src="data/dashboard-v5.0.js"></script>')
          s=s.replace('<script src="assets/core-v4.9.js"></script>','<script src="assets/core-v4.9.js"></script>\n<script src="assets/core-v5.0.js"></script>')
          s=s.replace('<script src="assets/report-v4.8.js"></script>','<script src="assets/report-v4.8.js"></script>\n<script src="assets/report-v5.0.js"></script>')
          s=s.replace('<script src="assets/app-v4.9.js"></script>','<script src="assets/app-v4.9.js"></script>\n<script src="assets/app-v5.0.js"></script>')
          p.write_text(s)

          for name in ['run-v3.4-tests.js','run-v3.5-tests.js']:
              p=Path('tests')/name; s=p.read_text(); s=s.replace("path.join(root,'README.md')","path.join(root,'CHANGELOG.md')"); p.write_text(s)

          p=Path('tests/run-v3.6-tests.js'); s=p.read_text()
          old="const readme=fs.readFileSync(path.join(root,'README.md'),'utf8'),notes=fs.readFileSync(path.join(root,'docs','v3.6.md'),'utf8')"
          new="const readme=fs.readFileSync(path.join(root,'README.md'),'utf8'),changelog=fs.readFileSync(path.join(root,'CHANGELOG.md'),'utf8'),notes=fs.readFileSync(path.join(root,'docs','v3.6.md'),'utf8')"
          s=s.replace(old,new).replace("assert(/AS-REP Roasting mentions Rubeus/i.test(readme));","assert(/AS-REP Roasting/i.test(changelog)&&/Rubeus/i.test(changelog));")
          p.write_text(s)

          for ver in ['3.7','3.8','3.9','4.0','4.1','4.2','4.3','4.4','4.5','4.6','4.7','4.8','4.9']:
              p=Path('tests')/f'run-v{ver}-tests.js'
              if not p.exists(): continue
              s=p.read_text()
              if "readme=fs.readFileSync(path.join(root,'README.md'),'utf8')" in s and "changelog=fs.readFileSync" not in s:
                  s=s.replace("readme=fs.readFileSync(path.join(root,'README.md'),'utf8')","readme=fs.readFileSync(path.join(root,'README.md'),'utf8'),changelog=fs.readFileSync(path.join(root,'CHANGELOG.md'),'utf8')")
              s=s.replace(f"readme.includes('## Obol v{ver}')",f"changelog.includes('## v{ver}')")
              if ver=='3.7': s=s.replace("/target-specific reachability/i.test(readme)","/target-specific reachability/i.test(changelog)")
              if ver=='3.8': s=s.replace("/listener health/i.test(readme)","/listener health/i.test(changelog)")
              p.write_text(s)
          PY
          git config user.name "platocres"
          git config user.email "49848326+platocres@users.noreply.github.com"
          git add index.html tests
          git commit -m "Wire Obol v5.0 and move historical test anchors to changelog"
          git push origin HEAD:release/obol-v5.0
