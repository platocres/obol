name: v9.50 cleanup

on:
  push:
    branches:
      - release/obol-v9.50

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/obol-v9.50
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore historical changelog wording and markdown spacing
        run: |
          node -e "const fs=require('fs');let p='CHANGELOG.md',s=fs.readFileSync(p,'utf8');s=s.replace('either an \u0060Obol vX.Y\u0060 or \u0060Release vX.Y\u0060 title','either an \u0060Obol vX.Y\u0060 or a \u0060Release vX.Y\u0060 title');fs.writeFileSync(p,s);p='docs/NOTES-INTEGRATION.md';s=fs.readFileSync(p,'utf8').replace('redundant code-level mechanic.\n## Dispositions','redundant code-level mechanic.\n\n## Dispositions');fs.writeFileSync(p,s);"
      - name: Commit cleanup
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md docs/NOTES-INTEGRATION.md
          git commit -m "Clean v9.50 release documentation"
          git push origin HEAD:release/obol-v9.50
