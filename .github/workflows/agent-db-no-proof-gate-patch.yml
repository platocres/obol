name: Agent database no-proof-gate patch

on:
  push:
    branches:
      - tool-builder-implemented-audit-ledger

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tool-builder-implemented-audit-ledger
      - name: Remove proof-gating from database command generation
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('data/product-hardening/database-tool-builders-current.js')
          s=p.read_text()
          repl={
            'Try gated LOAD_FILE read':'Try LOAD_FILE read',
            'Run gated COPY PROGRAM proof command':'Run COPY PROGRAM proof command',
            'Generate a gated `COPY PROGRAM` command-execution probe':'Generate a `COPY PROGRAM` command-execution probe',
            'Generate a gated enable-`xp_cmdshell` command':'Generate an enable-`xp_cmdshell` command',
            'Generate a gated `xp_cmdshell whoami` probe':'Generate an `xp_cmdshell whoami` probe',
            'Generate a gated custom `xp_cmdshell` command':'Generate a custom `xp_cmdshell` command',
            'gated COPY PROGRAM probes':'COPY PROGRAM probes',
            'gated xp_cmdshell paths':'xp_cmdshell paths',
            'gated xp_cmdshell execution':'xp_cmdshell execution',
            'explicitly gated xp_cmdshell probes':'explicit xp_cmdshell probes',
            'gate file/UDF capability checks before':'label file/UDF capability checks before',
            'gate COPY PROGRAM checks before':'label COPY PROGRAM checks before',
            'gated scheduler/external-table capability triage':'scheduler/external-table capability triage',
            'COPY PROGRAM is a gated server-side command-execution path':'COPY PROGRAM is a risk-labeled server-side command-execution path',
            'Treat CONFIG/write paths as dangerous and proof-gated.':'Treat CONFIG/write paths as dangerous and proof-boundary labeled.',
            'SQL Server command execution is gated on privileges and settings.':'SQL Server command execution depends on privileges and settings; generation stays selectable from the Tools page.',
            'Risk gate:':'Risk note:',
            'guidance gates':'guidance labels',
            'proof-gated':'proof-boundary labeled',
            'risk-gated':'risk-labeled',
            'evidence-gated':'proof-boundary labeled',
            'risk confirmation':'risk/context label',
            'Explicit confirmation, an OS command, and suitable PostgreSQL privilege.':'OS command text and suitable PostgreSQL privilege; Evidence is needed after execution to prove the result.',
            'Explicit confirmation and sysadmin-level access.':'Sysadmin-level access; Evidence is needed after execution to prove the result.',
            'Explicit confirmation and xp_cmdshell capability.':'xp_cmdshell capability; Evidence is needed after execution to prove the result.',
            'Explicit confirmation and command.':'Command text; Evidence is needed after execution to prove the result.',
            'Only enable or run xp_cmdshell with explicit lab authorization and pasted output.':'Only enable or run xp_cmdshell inside authorized lab scope, then paste output back for proof.',
            'If disabled and authorized, explicitly confirm before enabling.':'If disabled and authorized, decide deliberately before enabling.',
            'Use only in a reversible authorized lab when sysadmin is proven.':'Use only in a reversible authorized lab when sysadmin appears available.',
            'Use only after whoami/hostname proof and within lab scope.':'Use only after small identity checks and within lab scope.',
            'Use only in an authorized lab after capability evidence suggests it may work.':'Use in an authorized lab after capability checks suggest it may work.',
            'I am authorized to test server-side command execution':'Server-side command execution authorization note',
            'I am authorized to change SQL Server settings or run OS commands':'SQL Server setting or OS command authorization note'
          }
          for old,new in repl.items():
              s=s.replace(old,new)
          s=s.replace(",f('confirmServerExec','Server-side command execution authorization note','checkbox',{visibleWhen:{field:'action',equals:'copyProgramExec'},requiredWhen:{field:'action',equals:'copyProgramExec'},mustBeChecked:true})","")
          s=s.replace(",f('confirmServerExec','I am authorized to test server-side command execution','checkbox',{visibleWhen:{field:'action',equals:'copyProgramExec'},requiredWhen:{field:'action',equals:'copyProgramExec'},mustBeChecked:true})","")
          s=s.replace(",f('confirmRisk','SQL Server setting or OS command authorization note','checkbox',{visibleWhen:{field:'action',in:['enableXpCmdshell','xpWhoami','xpCommand']},requiredWhen:{field:'action',in:['enableXpCmdshell','xpWhoami','xpCommand']},mustBeChecked:true})","")
          s=s.replace(",f('confirmRisk','I am authorized to change SQL Server settings or run OS commands','checkbox',{visibleWhen:{field:'action',in:['enableXpCmdshell','xpWhoami','xpCommand']},requiredWhen:{field:'action',in:['enableXpCmdshell','xpWhoami','xpCommand']},mustBeChecked:true})","")
          bad=[x for x in ['proof-gated','risk-gated','evidence-gated','Run gated','Try gated','Generate a gated','Risk gate:'] if x.lower() in s.lower()]
          if bad:
              raise SystemExit('remaining proof-gate wording: '+repr(bad))
          if 'confirmServerExec' in s or 'confirmRisk' in s or 'mustBeChecked' in s:
              raise SystemExit('confirmation checkbox blocker still present')
          p.write_text(s)
          PY
      - name: Commit database patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-db-no-proof-gate-patch.yml
          git add data/product-hardening/database-tool-builders-current.js
          git commit -m "Remove proof-gating from database command generation"
          git push origin tool-builder-implemented-audit-ledger
