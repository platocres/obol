name: Agent web guidance patch runner

on:
  push:
    branches:
      - tool-builder-web-guidance-repair

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tool-builder-web-guidance-repair
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply web guidance patch
        run: |
          node tools/agent-web-guidance-hotfix.js
          node tools/agent-web-guidance-patch.js
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire web Tool Builder guidance repair"
          git push origin tool-builder-web-guidance-repair
