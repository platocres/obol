name: Fix v9.46 regressions

on:
  push:
    branches:
      - release/obol-v9.46
    paths:
      - .github/workflows/fix-v946-regressions.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/obol-v9.46
      - name: Repair durable historical contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path)
              text=p.read_text()
              if old not in text:
                  raise SystemExit(f'missing replacement target in {path}: {old[:80]}')
              p.write_text(text.replace(old,new,1))

          replace('data/runtime-manifest.js',
              'the domain/core fragment chains no longer execute directly',
              'the domain and core fragment chains no longer execute directly')

          replace('assets/product-hardening-dashboard.js',
              'Domain and core execute semantic current owners and CSS is a semantic cascade snapshot.',
              'Domain executes a semantic current snapshot, core executes a semantic delta replay, and CSS is a semantic cascade snapshot.')

          replace('tests/run-v9.46-tests.js',
              "const totals=q.totals();assert.strictEqual(totals.complete,207);assert.strictEqual(totals.total,650);assert(contracts.contracts['runtime-app-single-paint']);",
              "const readme=read('README.md');assert(readme.includes('**Current product-hardening queue:** 207/650 complete'),'generated Product Build Next preserves additive overall accounting');assert(contracts.contracts['runtime-app-single-paint']);")
          PY
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime-manifest.js assets/product-hardening-dashboard.js tests/run-v9.46-tests.js
          git commit -m "Repair v9.46 historical regression contracts"
          git push origin HEAD:release/obol-v9.46
