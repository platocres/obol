name: Temporary v9.35 build transformer

on:
  push:
    branches:
      - release/obol-v9.35
    paths:
      - 'tools/apply-v9.35-build.js'
      - 'tools/fix-v9.35-builder.js'
      - '.github/workflows/v9.35-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/obol-v9.35
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Repair transformer quoting
        run: node tools/fix-v9.35-builder.js
      - name: Apply v9.35 transformation and focused validation
        run: node tools/apply-v9.35-build.js
      - name: Commit transformed release
        run: |
          rm -f tools/fix-v9.35-builder.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+platocres@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: complete v9.35 Windows notes and documentation ownership"
            git push origin HEAD:release/obol-v9.35
          fi
