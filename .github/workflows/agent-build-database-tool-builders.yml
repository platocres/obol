name: Agent build database Tool Builder acceleration

on:
  push:
    branches:
      - release/obol-v10.21
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-database-tool-builders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/obol-v10.21
          fetch-depth: 0
      - name: Build database Tool Builder acceleration slice
        run: |
          set -euo pipefail
