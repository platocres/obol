name: Obol PR full regression suite

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: obol-pr-full-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  full-historical-regression:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run the complete regression contract suite
        run: node tools/run-historical-contracts.js
