name: Obol v9.45 release wiring

on:
  push:
    branches:
      - release/obol-v9.45

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-v945]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/obol-v9.45
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply release wiring and generated handoff
        run: |
          set -euo pipefail
          node tools/apply-v945-release.js
          node tools/sync-current-release.js --write
          node tools/sync-product-build-next.js --write
          node tools/sync-current-styles.js --check
          node --check tests/run-v9.45-tests.js
          node --check tools/validate-style-current-equivalence.js
          node --check tools/validate-style-visual-equivalence.js

      - name: Commit release wiring
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md data/runtime-manifest.js data/product-hardening/product-hardening-queue.js data/product-hardening/item-test-contracts.js assets/product-hardening-dashboard.js tools/validate-runtime-manifest.js tools/scope-check.js tools/release-preflight.js tests/run-v9.40-tests.js docs/ARCHITECTURE.md docs/PRODUCT-HARDENING.md docs/RUNTIME-COMPACTION.md
          git checkout -- .github/workflows/browser-smoke.yml
          git commit -m 'Complete v9.45 stylesheet ownership flattening'
          git push origin HEAD:release/obol-v9.45
